<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prusawire 2026.R1 Configurator by Positron3D</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- JSZip for creating ZIP downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h1>Prusawire 2026.R1</h1>
                <span class="subtitle">by Positron3D</span>
            </div>
            <div class="header-links">
                <a href="https://github.com/Positron3D/Prusawire" target="_blank">GitHub</a>
                <a href="https://discord.gg/positron" target="_blank">Discord</a>
            </div>
        </header>

        <main class="main-content">
            <!-- Configuration Panel -->
            <aside class="config-panel">
                <div class="config-panel-content">
                <h2>Configuration</h2>
                
                <!-- Color Customization -->
                <section class="config-section color-section">
                    <h3>Colors</h3>
                    <div class="color-pickers">
                        <div class="color-picker-group">
                            <label for="main-color">Main Color</label>
                            <input type="color" id="main-color" value="#444444">
                        </div>
                        <div class="color-picker-group">
                            <label for="accent-color">Accent Color</label>
                            <input type="color" id="accent-color" value="#A62C2B">
                        </div>
                    </div>
                </section>
                
                <!-- Option widgets are rendered here from the manifest's
                     configOptions by js/options_ui.js -->
                <div id="option-sections"></div>

                <!-- Warnings -->
                <section class="config-section warnings" id="warnings">
                    <!-- Dynamic warnings inserted here -->
                </section>

                <!-- Download Button -->
                <div class="download-section">
                    <!-- Hidden until the spec's stl: download paths are populated -->
                    <button class="btn-download" id="download-btn" style="display: none;">
                        Download Selected Parts
                    </button>
                    <button class="btn-copy-url" id="copy-url-btn">
                        Copy Configuration URL
                    </button>
                    <button class="btn-reset" id="reset-btn">
                        Reset to Defaults
                    </button>
                </div>
                </div><!-- end config-panel-content -->
                
                <!-- Scroll indicator for mobile -->
                <div class="scroll-indicator">
                    <svg width="20" height="16" viewBox="0 0 20 16" fill="currentColor">
                        <path d="M10 6L2 0L0.6 1.4L10 8.8L19.4 1.4L18 0L10 6Z"/>
                        <path d="M10 14L2 8L0.6 9.4L10 16.8L19.4 9.4L18 8L10 14Z" transform="translate(0,-1)"/>
                    </svg>
                </div>
            </aside>

            <!-- 3D Viewer -->
            <div class="viewer-container">
                <div id="viewer-3d"></div>
                
                <!-- Viewer Controls -->
                <div class="viewer-controls">
                    <button class="viewer-btn viewer-btn-blank" tabindex="-1"></button>
                    <button class="viewer-btn" data-view="top" title="Top">▲<br>Top</button>
                    <button class="viewer-btn" data-view="front" title="Front">◉<br>Front</button>

                    <button class="viewer-btn" data-view="left" title="Left">◀<br>Left</button>
                    <button class="viewer-btn" data-view="home" title="Home">⌂<br>Home</button>
                    <button class="viewer-btn" data-view="right" title="Right">▶<br>Right</button>

                    <button class="viewer-btn viewer-btn-blank" tabindex="-1"></button>
                    <button class="viewer-btn" data-view="bottom" title="Bottom">▼<br>Bottom</button>
                    <button class="viewer-btn" data-view="back" title="Back">◈<br>Back</button>

                    <div class="viewer-btn-separator"></div>

                    <button class="viewer-btn" id="btn-zoom-out" title="Zoom Out">−<br>Zoom</button>
                    <button class="viewer-btn" id="btn-zoom-reset" title="Reset Zoom">⟳<br>Reset</button>
                    <button class="viewer-btn" id="btn-zoom-in" title="Zoom In">+<br>Zoom</button>

                    <div class="viewer-btn-separator"></div>

                    <button class="viewer-btn" id="btn-wireframe" title="Wireframe">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18l6.9 3.45L12 11.08 5.1 7.63 12 4.18zM4 8.82l7 3.5v7.86l-7-3.5V8.82zm9 11.36v-7.86l7-3.5v7.86l-7 3.5z"/></svg><br>Wire
                    </button>

                    <div class="viewer-btn-separator"></div>

                    <label class="slider-label" for="brightness-slider">Brightness</label>
                    <input type="range" id="brightness-slider" min="0" max="200" value="150" title="Brightness">
                </div>

                <!-- Loading Indicator -->
                <div class="loading-indicator" id="loading">
                    <div class="loading-line">
                        <div class="spinner-small"></div>
                        <span id="loading-text">Loading...</span>
                    </div>
                    <div class="loading-progress">
                        <div class="loading-progress-fill" id="loading-progress-fill"></div>
                    </div>
                    <div class="loading-line hidden" id="processing-line">
                        <div class="spinner-small"></div>
                        <span id="processing-text"></span>
                    </div>
                </div>

                <!-- Attribution -->
                <div class="attribution">
                    Inspired by and based on the <a href="https://a4t.dwtas.net/" target="_blank" rel="noopener">A4T Toolhead Configurator</a>
                </div>
            </div>
        </main>
    </div>

    <!-- Three.js and app scripts -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/app.js"></script>
    
    <!-- DEV TOOL: Model Positioner - Uncomment this line when positioning new models -->
    <!-- script type="module" src="js/devModelPositioner.js"></script> -->
</body>
</html>
